apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: product-rollout
  namespace: default
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product-service-container
          image: 139144002104.dkr.ecr.ap-northeast-2.amazonaws.com/product-service:1.0.0-pd.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: product-service-config
            - secretRef:
                name: product-service-secret
  strategy:
    blueGreen:
      #activeService는 현재 운영중인 Blue 서비스
      activeService: product-service-active

      #previewService는 새롭게 배포될 Green 서비스
      previewService: product-service-preview