apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
spec:
  project: default
  source:
    repoURL: 'https://github.com/nbc-expert-6/SSaGops.git'
    path: 'dev'
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # 하위 앱 정의
  sources:
    - path: analysis
    - path: product
    - path: recommend
    - path: ingress